{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card">

        <div class="card-header">
            <h3>Delete Document</h3>
        </div>

        <div class="card-body">

            <p>
                Are you sure you want to delete
                <strong>{{ document.title }}</strong>?
            </p>

            <p class="text-danger">
                This will permanently delete the uploaded PDF
                and its extracted text.
            </p>


            <form method="post">

                {% csrf_token %}

                <button
                    type="submit"
                    class="btn btn-danger"
                >
                    Yes, Delete
                </button>

                <a
                    href="{% url 'documents:document_detail' document.pk %}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
