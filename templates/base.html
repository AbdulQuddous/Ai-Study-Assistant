<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        AI Study Assistant
        {% endblock %}
    </title>
</head>

<body>

<header>
    <nav>
        <a href="/">AI Study Assistant</a>

        {% if user.is_authenticated %}

        <a href="{% url 'dashboard' %}">
            Dashboard
        </a>

        <a href="{% url 'profile' %}">
            Profile
        </a>

        <form
            method="POST"
            action="{% url 'logout' %}"
            style="display:inline;"
        >
            {% csrf_token %}

            <button type="submit">
                Logout
            </button>
        </form>

    {% else %}

        <a href="{% url 'login' %}">
            Login
        </a>

        <a href="{% url 'register' %}">
            Register
        </a>

    {% endif %}
    </nav>
</header>

<main>

    {% block content %}
    {% endblock %}

</main>

</body>
</html>
