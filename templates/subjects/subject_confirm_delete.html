{% extends "base.html" %}

{% block title %}
Delete Subject
{% endblock %}

{% block content %}

<h1>Delete Subject</h1>

<p>
    Are you sure you want to delete
    <strong>{{ subject.name }}</strong>?
</p>

<form method="POST">

    {% csrf_token %}

    <button type="submit">
        Yes, Delete
    </button>

</form>

<a
    href="{% url 'subject_detail' subject.pk %}"
>
    Cancel
</a>

{% endblock %}
