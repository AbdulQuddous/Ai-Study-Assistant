{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card">

        <div class="card-body">

            <h2>Delete Note</h2>

            <p>
                Are you sure you want to delete:
            </p>

            <h4>
                "{{ note.title }}"
            </h4>

            <p class="text-danger">
                This action cannot be undone.
            </p>

            <form method="post">

                {% csrf_token %}

                <button
                    type="submit"
                    class="btn btn-danger"
                >
                    Yes, Delete
                </button>

                <a
                    href="{% url 'note_detail' note.pk %}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
