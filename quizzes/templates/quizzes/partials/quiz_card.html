<div class="card h-100 shadow-sm">
  <div class="card-body d-flex flex-column">
    <h5 class="card-title">{{ quiz.title }}</h5>
    <p class="text-muted small mb-1">{{ quiz.document }}</p>
    <p class="card-text small">{{ quiz.description }}</p>
    <div class="mt-auto d-flex justify-content-between align-items-center">
      <span class="badge bg-secondary">{{ quiz.question_count }} questions</span>
      {% if quiz.last_score is not None %}
        <span class="badge bg-info text-dark">Last: {{ quiz.last_score }}/{{ quiz.last_total }}</span>
      {% endif %}
      <a href="{% url 'quizzes:quiz_take' quiz.pk %}" class="btn btn-primary btn-sm">Take</a>
    </div>
  </div>
</div>
