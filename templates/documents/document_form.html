{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h1>{{ title }}</h1>

    <form
        method="post"
        enctype="multipart/form-data"
    >

        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="btn btn-primary"
        >
            Upload PDF
        </button>

        <a
            href="{% url 'documents:document_list' %}"
            class="btn btn-secondary"
        >
            Cancel
        </a>

    </form>

</div>

{% endblock %}
